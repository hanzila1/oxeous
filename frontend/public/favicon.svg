<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .ring { stroke: #1D2227; }
    .spoke { stroke: #1D2227; opacity: 0.55; }
    .dot { fill: #315F50; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #F4F5F6; }
      .spoke { stroke: #F4F5F6; opacity: 0.65; }
      .dot { fill: #58B89A; }
    }
  </style>
  <line x1="10" y1="50" x2="25" y2="50" class="spoke" stroke-width="6.5" stroke-linecap="round" />
  <line x1="75" y1="50" x2="90" y2="50" class="spoke" stroke-width="6.5" stroke-linecap="round" />
  <circle cx="50" cy="50" r="40" class="ring" stroke-width="7" />
  <circle cx="50" cy="50" r="25" class="ring" stroke-width="6" opacity="0.82" />
  <circle cx="25" cy="50" r="9.5" class="dot" />
</svg>
