[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oxeous-backend"
version = "0.1.0"
description = "Oxeous — Earth Observation Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.2",
    "diskcache>=5.6",
    "numpy>=1.26",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pystac-client>=0.8",
    "xarray>=2024.6",
    "odc-stac>=0.3",
    "rio-tiler>=6.6",
    "geojson>=3.1",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "cachetools>=5.3",
]

[project.optional-dependencies]
prithvi = [
    "torch>=2.3",
    "terratorch>=0.99",
    "transformers>=4.42",
    "huggingface-hub>=0.23",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
