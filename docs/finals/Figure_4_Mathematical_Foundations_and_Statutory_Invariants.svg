<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" style="background:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 38px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-size: 20px; font-weight: 400; fill: #64748B; }
      .badge-txt { font-size: 15px; font-weight: 700; }
      .card-title { font-size: 26px; font-weight: 800; fill: #0F172A; }
      .card-sub { font-size: 16px; font-weight: 400; fill: #334155; }
      .math-main { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 34px; font-weight: bold; fill: #0F172A; }
      .math-sub { font-family: 'Consolas', 'Courier New', monospace; font-size: 19px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .box-desc { font-size: 14px; font-weight: 400; fill: #475569; }
      .master-title { font-size: 15px; font-weight: 800; fill: #34D399; letter-spacing: 0.5px; }
      .master-math { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 29px; font-weight: bold; fill: #FFFFFF; }
      .master-sub { font-size: 18px; font-weight: 400; fill: #94A3B8; }
    </style>
