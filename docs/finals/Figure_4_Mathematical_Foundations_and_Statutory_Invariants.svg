    <circle cx="27.5" cy="27.5" r="12" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <line x1="27.5" y1="9" x2="27.5" y2="46" stroke="#FFFFFF" stroke-width="2" />
    <line x1="9" y1="27.5" x2="46" y2="27.5" stroke="#FFFFFF" stroke-width="2" />
    
    <text x="75" y="32" class="title">OXEOUS: MATHEMATICAL FOUNDATIONS &amp; STATUTORY DERIVATIONS</text>
    <text x="75" y="58" class="subtitle">Direct Mathematical Remedies to European Union Deforestation Regulation (EUDR 2023/1115) &amp; May 2026 Package</text>
