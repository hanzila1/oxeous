  <!-- ==================== CARD 1: PILLAR 1 ==================== -->
  <g transform="translate(50, 135)" filter="url(#card-shadow)">
    <rect width="1130" height="505" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect width="1130" height="7" rx="3.5" fill="#059669" />

    <text x="26" y="35" class="badge-txt" fill="#059669">PILLAR 1 · SPATIAL &amp; ONTOLOGICAL TENSOR ENGINE</text>
    <rect x="790" y="16" width="315" height="28" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="947" y="35" text-anchor="middle" class="badge-txt" fill="#0F172A">EUR-Lex Art. 2(4), Art. 2(5) &amp; Recital 37</text>

    <text x="26" y="68" class="card-title">PWRI-3D Tri-Axial Tensor Adjudication</text>

    <!-- Problem Box -->
    <rect x="24" y="84" width="1082" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="36" y="108" class="card-sub" fill="#64748B"><tspan font-weight="bold" fill="#E11D48">Industry Fatal Flaw:</tspan> Conventional 2D GIS cannot distinguish between illegal primary forest clearing and cyclical cocoa/coffee</text>
    <text x="36" y="130" class="card-sub" fill="#0F172A">tree crop renewal, generating up to 75% false positives across West Africa and Southeast Asia (Thünen 2025).</text>

    <!-- Equation Box -->
    <rect x="24" y="156" width="1082" height="118" rx="12" fill="#F8FAFC" stroke="#059669" stroke-width="2" />
    <rect x="40" y="146" width="145" height="20" rx="6" fill="#059669" />
    <text x="112" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">DERIVED EQUATION</text>
    
    <text x="42" y="206" class="math-main">M(x, y) = L_spatial(x, y) &#x2297; L_temporal(x, y) &#x2229; L_statutory(x, y)</text>
    <text x="42" y="248" class="math-sub" fill="#059669">Classify: C(x,y) = [&#x394;S_T0&#x2192;Tcurr &#x2229; B_JRC2020] \ [E_Art.2(5) &#x222A; E_Art.2(3)]</text>

    <!-- 4 Sub-boxes -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="530" height="88" rx="8" fill="#FFF1F2" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="28" class="box-title" fill="#E11D48">Art. 3(a) Violation</text>
      <text x="16" y="52" class="box-desc">Loss &#x2229; Statutory Forest 2020 baseline</text>
      <text x="16" y="72" class="box-desc" fill="#94A3B8">Mandatory quarantine; non-compliant under EU customs</text>

      <rect x="550" y="0" width="530" height="88" rx="8" fill="#FFFBEB" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="28" class="box-title" fill="#D97706">Art. 2(5) Replanting</text>
      <text x="566" y="52" class="box-desc">Loss &#x2229; Agroforestry Canopy (FDP 10m &gt; 65%)</text>
      <text x="566" y="72" class="box-desc" fill="#94A3B8">Certified lawful agricultural renewal; 0% false violation</text>

      <rect x="0" y="98" width="530" height="88" rx="8" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="126" class="box-title" fill="#2563EB">Art. 2(3) Silviculture</text>
      <text x="16" y="150" class="box-desc">Loss &#x2229; Managed Planted Forest (JRC Class 2)</text>
      <text x="16" y="170" class="box-desc" fill="#94A3B8">Sustainable timber harvest without land-use conversion</text>

      <rect x="550" y="98" width="530" height="88" rx="8" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="126" class="box-title" fill="#059669">Art. 3(a) Deforestation-Free</text>
      <text x="566" y="150" class="box-desc">Zero Statutory Disturbance across all consensus layers</text>
      <text x="566" y="170" class="box-desc" fill="#94A3B8">Certified 100% compliant for TRACES NT customs clearance</text>
    </g>
  </g>

  <!-- ==================== CARD 2: PILLAR 2 ==================== -->
  <g transform="translate(1220, 135)" filter="url(#card-shadow)">
    <rect width="1130" height="505" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect width="1130" height="7" rx="3.5" fill="#2563EB" />

    <text x="26" y="35" class="badge-txt" fill="#2563EB">PILLAR 2 · TOPOLOGICAL SEGREGATION STUDIO</text>
    <rect x="750" y="16" width="355" height="28" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="927" y="35" text-anchor="middle" class="badge-txt" fill="#0F172A">EUR-Lex Art. 9(1)(d) &amp; Commission May 2026 Package</text>

    <text x="26" y="68" class="card-title">Continuous Topological Plot Carve-Out</text>

    <!-- Problem Box -->
    <rect x="24" y="84" width="1082" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="36" y="108" class="card-sub" fill="#64748B"><tspan font-weight="bold" fill="#E11D48">Statutory Impasse:</tspan> Art. 9(1)(d) automatically disqualifies an ENTIRE parcel if any pixel was disturbed.</text>
    <text x="36" y="130" class="card-sub" fill="#0F172A">An isolated 1 ha loss on a 150 ha estate causes complete commercial forfeiture and financial ruin for smallholders.</text>

    <!-- Equation Box -->
    <rect x="24" y="156" width="1082" height="118" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2" />
    <rect x="40" y="146" width="145" height="20" rx="6" fill="#2563EB" />
    <text x="112" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">DERIVED EQUATION</text>
    
    <text x="42" y="206" class="math-main">P_export = P_declared \ &#x22C3; { &#x03A9;(x, y) | C(x, y) = Art. 3(a) }</text>
    <text x="42" y="248" class="math-sub" fill="#2563EB">Conservation Identity: A_total = A_clean + A_replant + A_silviculture + A_violation</text>

    <!-- 4 Sub-boxes -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="530" height="88" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="28" class="box-title" fill="#0F172A">Topological Excision</text>
      <text x="16" y="52" class="box-desc">P_export = P_decl \ V_3(a) cleanly cuts dirty sub-polygons</text>
      <text x="16" y="72" class="box-desc" fill="#94A3B8">Automated shapely GIS difference operator</text>

      <rect x="550" y="0" width="530" height="88" rx="8" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="28" class="box-title" fill="#059669">Zero Discrepancy</text>
      <text x="566" y="52" class="box-desc">Exact Area Conservation: &#x00B1;0.00 ha mismatch</text>
      <text x="566" y="72" class="box-desc" fill="#94A3B8">Mathematically provable area conservation across polygons</text>

      <rect x="0" y="98" width="530" height="88" rx="8" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="126" class="box-title" fill="#2563EB">Instant Clearance</text>
      <text x="16" y="150" class="box-desc">Salvages up to 90% of compliant volume for immediate export</text>
      <text x="16" y="170" class="box-desc" fill="#94A3B8">Generates compliant GeoJSON ready for TRACES NT</text>

      <rect x="550" y="98" width="530" height="88" rx="8" fill="#F5F3FF" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="126" class="box-title" fill="#7C3AED">May 2026 Protocol Ready</text>
      <text x="566" y="150" class="box-desc">Full algorithmic realization of COM(2026) 191 plot segregation</text>
      <text x="566" y="170" class="box-desc" fill="#94A3B8">First industry engine implementing the EC simplification guidance</text>
    </g>
  </g>

  <!-- ==================== CARD 3: PILLAR 3 ==================== -->
  <g transform="translate(50, 660)" filter="url(#card-shadow)">
    <rect width="1130" height="505" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect width="1130" height="7" rx="3.5" fill="#D97706" />

    <text x="26" y="35" class="badge-txt" fill="#D97706">PILLAR 3 · ANTI-FRAUD MASS-BALANCE GATE</text>
    <rect x="750" y="16" width="355" height="28" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="927" y="35" text-anchor="middle" class="badge-txt" fill="#0F172A">EUR-Lex Art. 10(2)(f), Art. 16(3) &amp; Reg. 2025/2650</text>

    <text x="26" y="68" class="card-title">Biophysical Yield &amp; Commodity Laundering Invariant</text>

    <!-- Problem Box -->
    <rect x="24" y="84" width="1082" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="36" y="108" class="card-sub" fill="#64748B"><tspan font-weight="bold" fill="#E11D48">Customs Laundering Risk:</tspan> Operators could carve out a tiny 1-ha clean parcel and claim an entire 50-tonne harvest</text>
    <text x="36" y="130" class="card-sub" fill="#0F172A">originated from it, laundering illegal deforested volume straight through EU customs.</text>

    <!-- Equation Box -->
    <rect x="24" y="156" width="1082" height="118" rx="12" fill="#F8FAFC" stroke="#D97706" stroke-width="2" />
    <rect x="40" y="146" width="145" height="20" rx="6" fill="#D97706" />
    <text x="112" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">DERIVED EQUATION</text>
    
    <text x="42" y="206" class="math-main">Y_implied = M_declared / &#x222C;_{P_export} dA  &#x2264;  Y_ceiling(crop, region)</text>
    <text x="42" y="248" class="math-sub" fill="#D97706">Decision: CERTIFIED if Y_implied &#x2264; Y_ceiling ; REJECTED if Y_implied &gt; Y_ceiling</text>

    <!-- 4 Sub-boxes -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="530" height="88" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="28" class="box-title" fill="#0F172A">Implied Biophysical Yield</text>
      <text x="16" y="52" class="box-desc">Y_implied = M_net / A_clean [kg/ha/yr dry beans / CPO]</text>
      <text x="16" y="72" class="box-desc" fill="#94A3B8">Calculated automatically from declared customs mass</text>

      <rect x="550" y="0" width="530" height="88" rx="8" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="28" class="box-title" fill="#2563EB">Agronomic Ceilings</text>
      <text x="566" y="52" class="box-desc">Hard regional yield limits from FAO, ICCO &amp; CIRAD</text>
      <text x="566" y="72" class="box-desc" fill="#94A3B8">Empirically calibrated to prevent agronomic fraud</text>

      <rect x="0" y="98" width="530" height="88" rx="8" fill="#FFF1F2" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="126" class="box-title" fill="#E11D48">Anti-Laundering Shield</text>
      <text x="16" y="150" class="box-desc">Instantly flags illicit volume inflated beyond biological limits</text>
      <text x="16" y="170" class="box-desc" fill="#94A3B8">Prevents fraudulent plot-carve-out volume smuggling</text>

      <rect x="550" y="98" width="530" height="88" rx="8" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="126" class="box-title" fill="#059669">Box 44 Certification</text>
      <text x="566" y="150" class="box-desc">Unlocks TARIC Certificate Code C716 for Single Window</text>
      <text x="566" y="170" class="box-desc" fill="#94A3B8">Legally verified due-diligence statement in TRACES NT</text>
    </g>
  </g>

  <!-- ==================== CARD 4: PILLAR 4 ==================== -->
  <g transform="translate(1220, 660)" filter="url(#card-shadow)">
    <rect width="1130" height="505" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <rect width="1130" height="7" rx="3.5" fill="#7C3AED" />

    <text x="26" y="35" class="badge-txt" fill="#7C3AED">PILLAR 4 · MULTI-AGENT CONSENSUS &amp; PROVENANCE</text>
    <rect x="750" y="16" width="355" height="28" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="927" y="35" text-anchor="middle" class="badge-txt" fill="#0F172A">EUR-Lex Art. 3(c), Art. 25(2) &amp; Art. 33 (TRACES NT)</text>

    <text x="26" y="68" class="card-title">Bayesian Consensus &amp; Cryptographic Merkle Root</text>

    <!-- Problem Box -->
    <rect x="24" y="84" width="1082" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="36" y="108" class="card-sub" fill="#64748B"><tspan font-weight="bold" fill="#E11D48">Audit &amp; Penalty Moat:</tspan> Member state authorities impose fines &#x2265; 4% of EU annual turnover (Art. 25(2)).</text>
    <text x="36" y="130" class="card-sub" fill="#0F172A">Single-sensor alerts are too fragile; customs requires deterministic, tamper-proof proof of due diligence.</text>

    <!-- Equation Box -->
    <rect x="24" y="156" width="1082" height="118" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2" />
    <rect x="40" y="146" width="145" height="20" rx="6" fill="#7C3AED" />
    <text x="112" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">DERIVED EQUATION</text>
    
    <text x="42" y="206" class="math-main">&#x03A6;_consensus = [ &#x2211; w_k &#x00B7; c_k &#x00B7; &#x03C3;_k ] / [ &#x2211; w_k &#x00B7; c_k ]  &#x2265;  &#x03C4;_statutory</text>
    <text x="42" y="248" class="math-sub" fill="#7C3AED">H_root = SHA256( H(P_geodesic) &#x2016; H(C_PWRI) &#x2016; H(Y_implied) &#x2016; H(&#x03A6;_consensus) )</text>

    <!-- 4 Sub-boxes -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="530" height="88" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="28" class="box-title" fill="#0F172A">Bayesian Multi-Sensor Matrix</text>
      <text x="16" y="52" class="box-desc">w_SAR=0.98, w_JRC=0.95, w_Hansen=0.90, w_FDP=0.88</text>
      <text x="16" y="72" class="box-desc" fill="#94A3B8">Weights calibrated by sensor physics and cloud immunity</text>

      <rect x="550" y="0" width="530" height="88" rx="8" fill="#F5F3FF" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="28" class="box-title" fill="#7C3AED">Deterministic Supervisor</text>
      <text x="566" y="52" class="box-desc">Zero-hallucination closed-loop arbitration across 6 agents</text>
      <text x="566" y="72" class="box-desc" fill="#94A3B8">Autonomous evidence arbitration without LLM drift</text>

      <rect x="0" y="98" width="530" height="88" rx="8" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="126" class="box-title" fill="#2563EB">Merkle State Tree</text>
      <text x="16" y="150" class="box-desc">Cryptographic SHA-256 hash embedded in TRACES NT XML</text>
      <text x="16" y="170" class="box-desc" fill="#94A3B8">Immutable verification state linked to polygon vertices</text>

      <rect x="550" y="98" width="530" height="88" rx="8" fill="#ECFDF5" stroke="#CBD5E1" stroke-width="1" />
      <text x="566" y="126" class="box-title" fill="#059669">Customs Audit Defense</text>
      <text x="566" y="150" class="box-desc">Tamper-evident evidence bundle for 5-year statutory audit</text>
      <text x="566" y="170" class="box-desc" fill="#94A3B8">Guarantees full legal immunity under Art. 25(2)</text>
    </g>
  </g>

  <!-- ==================== BOTTOM MASTER BANNER ==================== -->
  <g transform="translate(50, 1195)">
    <rect width="2300" height="120" rx="16" fill="#0F172A" stroke="#315F50" stroke-width="2" />
    
    <text x="28" y="26" class="master-title">THE OXEOUS UNIFIED REGULATORY INVARIANT</text>
    <text x="28" y="60" class="master-math">P_export = P_declared \ V_Art.3(a)   subject to:   [ M_harvest / Area(P_export) ]  &#x2264;  Y_max(crop, region)   &#x2227;   &#x03A6;_consensus &#x2265; &#x03C4;_statutory</text>
    <text x="28" y="98" class="master-sub">Guarantees 100% Deforestation-Free customs compliance while eliminating up to 75% agroforestry false-positives and 0% volume laundering.</text>

    <!-- TRACES Badge on right -->
    <g transform="translate(2040, 26)">
      <rect width="230" height="68" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="2" />
      <text x="115" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#34D399">TRACES NT READY</text>
      <text x="115" y="50" text-anchor="middle" font-size="13" fill="#E2E8F0">TARIC Box 44 · Code C716</text>
    </g>
  </g>
</svg>