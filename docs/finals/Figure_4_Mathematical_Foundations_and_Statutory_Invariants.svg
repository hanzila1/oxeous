  <g stroke="#F1F5F9" stroke-width="1">
    <line x1="160" y1="30" x2="160" y2="1320" />
    <line x1="400" y1="30" x2="400" y2="1320" />
    <line x1="640" y1="30" x2="640" y2="1320" />
    <line x1="880" y1="30" x2="880" y2="1320" />
    <line x1="1120" y1="30" x2="1120" y2="1320" />
    <line x1="1280" y1="30" x2="1280" y2="1320" />
    <line x1="1520" y1="30" x2="1520" y2="1320" />
    <line x1="1760" y1="30" x2="1760" y2="1320" />
    <line x1="2000" y1="30" x2="2000" y2="1320" />
    <line x1="2240" y1="30" x2="2240" y2="1320" />
  </g>

  <!-- Header -->
